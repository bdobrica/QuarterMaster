services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      QM_DATA_DIR: /data
      MUSTER_AI_BASE_URL: ${MUSTER_AI_BASE_URL:-}
      MUSTER_AI_MODEL: ${MUSTER_AI_MODEL:-}
      MUSTER_AI_API_KEY: ${MUSTER_AI_API_KEY:-}
      MUSTER_AI_REASONING_EFFORT: ${MUSTER_AI_REASONING_EFFORT:-}
      QM_BUILDER_BASE_URL: ${QM_BUILDER_BASE_URL:-}
      QM_BUILDER_MODEL: ${QM_BUILDER_MODEL:-}
      QM_BUILDER_API_KEY: ${QM_BUILDER_API_KEY:-}
      QM_BUILDER_API_KEY_FILE: ${QM_BUILDER_API_KEY_FILE:-}
      QM_BUILDER_TIMEOUT_SECONDS: ${QM_BUILDER_TIMEOUT_SECONDS:-20}
      QM_BUILDER_MAX_INPUT_BYTES: ${QM_BUILDER_MAX_INPUT_BYTES:-49152}
      QM_ADVISER_BASE_URL: ${QM_ADVISER_BASE_URL:-}
      QM_ADVISER_MODEL: ${QM_ADVISER_MODEL:-}
      QM_ADVISER_REASONING_EFFORT: ${QM_ADVISER_REASONING_EFFORT:-}
      QM_ADVISER_API_KEY: ${QM_ADVISER_API_KEY:-}
      QM_ADVISER_API_KEY_FILE: ${QM_ADVISER_API_KEY_FILE:-}
      QM_ADVISER_TIMEOUT_SECONDS: ${QM_ADVISER_TIMEOUT_SECONDS:-60}
      QM_ADVISER_LOCAL_ONLY: ${QM_ADVISER_LOCAL_ONLY:-false}
      QM_LOCAL_BASE_URL: ${QM_LOCAL_BASE_URL:-}
      QM_LOCAL_MODEL_SHA256: ${QM_LOCAL_MODEL_SHA256:-}
      QM_LOCAL_MODEL_REVISION: ${QM_LOCAL_MODEL_REVISION:-2fc06364715b967f1860aea9cf38778875588b17}
      QM_LOCAL_TIMEOUT_SECONDS: ${QM_LOCAL_TIMEOUT_SECONDS:-180}
      QM_COMPARISON_BASE_URL: ${QM_COMPARISON_BASE_URL:-}
      QM_COMPARISON_MODEL_SHA256: ${QM_COMPARISON_MODEL_SHA256:-}
      QM_CANDIDATE_BASE_URL: ${QM_CANDIDATE_BASE_URL:-http://candidate:8080}
      QM_EXPORT_RUNTIME_IMAGE: ${QM_EXPORT_RUNTIME_IMAGE:-}
    volumes:
      - quartermaster-data:/data
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  inference:
    profiles: ["advice"]
    image: quartermaster-local-runtime:m4
    pull_policy: never
    volumes:
      - ${QM_LOCAL_MODEL_DIR:-./data/local-model}:/model:ro
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]
    init: true
    mem_limit: ${QM_LOCAL_MEMORY_LIMIT:-4g}
    cpus: 4
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

volumes:
  quartermaster-data:
