services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      QM_DATA_DIR: /data
      QM_BUILDER_BASE_URL: ${QM_BUILDER_BASE_URL:-}
      QM_BUILDER_MODEL: ${QM_BUILDER_MODEL:-}
      QM_BUILDER_API_KEY: ${QM_BUILDER_API_KEY:-}
      QM_BUILDER_API_KEY_FILE: ${QM_BUILDER_API_KEY_FILE:-}
      QM_BUILDER_TIMEOUT_SECONDS: ${QM_BUILDER_TIMEOUT_SECONDS:-20}
      QM_LOCAL_BASE_URL: ${QM_LOCAL_BASE_URL:-}
      QM_LOCAL_MODEL_SHA256: ${QM_LOCAL_MODEL_SHA256:-}
      QM_LOCAL_TIMEOUT_SECONDS: ${QM_LOCAL_TIMEOUT_SECONDS:-120}
    volumes:
      - quartermaster-data:/data
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  inference:
    profiles: ["advice"]
    image: quartermaster-local-runtime:m4
    pull_policy: never
    volumes:
      - ./data/local-model:/model:ro
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]
    init: true
    mem_limit: 4g
    cpus: 4
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

volumes:
  quartermaster-data:
