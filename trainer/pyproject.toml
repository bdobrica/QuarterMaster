[project]
name = "quartermaster-spike-trainer"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch==2.11.0",
  "transformers==5.20.2",
  "trl==0.29.0",
  "peft==0.21.2",
  "accelerate==1.15.0",
  "datasets==5.1.0",
  "safetensors==0.8.0",
  "pydantic==2.14.1",
  "sentencepiece==0.2.1",
  "protobuf==6.33.0",
  "requests==2.32.5",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
