[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "quartermaster"
version = "0.1.0.dev0"
description = "A local factory for teachable AI advisers"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "jinja2==3.1.6",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "python-multipart==0.0.32",
  "openpyxl==3.1.5",
  "defusedxml==0.7.1",
  "httpx2==2.16.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not gpu and not live'"
markers = [
  "gpu: opt-in tests requiring GPU hardware",
  "live: opt-in tests calling a real model or external provider",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["quartermaster"]
