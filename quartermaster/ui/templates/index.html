{% extends "base.html" %}
{% block content %}
<section>
  <p class="eyebrow">Start with a decision</p>
  <h1>What would you like your adviser to help you decide?</h1>
  <p>Create a project and describe its mission. Teaching, testing, training and export will arrive in later milestones.</p>
  <form action="/projects" method="post" hx-post="/projects" hx-target="#projects" hx-swap="outerHTML">
    <label for="name">Project name</label>
    <input id="name" name="name" required maxlength="120" placeholder="My adviser">
    <label for="mission">Advisory mission</label>
    <textarea id="mission" name="mission" required maxlength="4000" rows="4" placeholder="Describe the decisions you want help with."></textarea>
    <button type="submit">Create project</button>
  </form>
</section>
{% include "projects.html" %}
{% endblock %}
