<tr><td><input type="hidden" name="key" value="{{ field.key }}"><input type="text" name="label" aria-label="Field name" maxlength="80" value="{{ field.label }}"></td><td><select name="type" aria-label="Field type">{% for key, label in field_types.items() %}<option value="{{ key }}" {% if field.type == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></td><td><textarea name="description" aria-label="What to look for" rows="2" maxlength="600">{{ field.description }}</textarea></td><td><button type="button" data-remove-field aria-label="Remove field {{ field.label }}">Remove</button></td></tr>
